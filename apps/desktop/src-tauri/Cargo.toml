[package]
name = "phirender-desktop"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
phigros-rpen-converter = { path = "../../..", default-features = false }
rfd = "0.17.2"
anyhow = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
